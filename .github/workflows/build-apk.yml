name: Build DrumLab APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Reuse one debug keystore across workflow runs so Android recognizes
      # every subsequent APK as an update to the same installed app.
      - name: Prepare stable Android signing key
        shell: bash
        run: mkdir -p "$HOME/.android"

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: drumlab-android-debug-signing-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Prepare Capacitor project from index.html
        shell: bash
        run: |
          test -f index.html || (echo "ERROR: index.html was not found in the repository root." && exit 1)
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "drumlab-android",
            "version": "1.0.0",
            "private": true,
            "description": "DrumLab Android wrapper",
            "scripts": {
              "build:android": "cap sync android"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.qwermz33.drumlab",
            "appName": "DrumLab",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          npm install @capacitor/core@^7 @capacitor/android@^7
          npm install --save-dev @capacitor/cli@^7
          npx cap add android
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '    <application'
          permissions = (
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\\n'
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\\n\\n'
          )
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace(marker, permissions + marker, 1)
          p.write_text(s)
          PY
          npx cap sync android

          # Android requires a strictly increasing versionCode for in-place updates.
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          code = int(os.environ["GITHUB_RUN_NUMBER"])
          s, n = re.subn(r'versionCode\\s+\\d+', f'versionCode {code}', s, count=1)
          if n != 1:
              raise SystemExit("Could not set Android versionCode in app/build.gradle")
          s, n = re.subn(r'versionName\\s+"[^"]+"', f'versionName "1.0.{code}"', s, count=1)
          if n != 1:
              raise SystemExit("Could not set Android versionName in app/build.gradle")
          p.write_text(s)
          print(f"DrumLab version: 1.0.{code} (versionCode {code})")
          PY

      - name: Build APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Package APK into a simple ZIP
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/DrumLab.apk
          cd release
          zip -j DrumLab-Android.zip DrumLab.apk

      - name: Upload ZIP to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: DrumLab-Android
          path: release/DrumLab-Android.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK ZIP in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: drumlab-latest
          name: DrumLab — latest APK
          body: "Скачайте DrumLab.apk для прямой установки или DrumLab-Android.zip, если нужен архив."
          files: |
            release/DrumLab.apk
            release/DrumLab-Android.zip
          make_latest: true
