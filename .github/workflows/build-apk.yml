name: Build DrumLab APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Capacitor project from index.html
        shell: bash
        run: |
          test -f index.html || (echo "ERROR: index.html was not found in the repository root." && exit 1)
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "drumlab-android",
            "version": "1.0.0",
            "private": true,
            "description": "DrumLab Android wrapper",
            "scripts": {
              "build:android": "cap sync android"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.qwermz33.drumlab",
            "appName": "DrumLab",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          npm install @capacitor/core@^7 @capacitor/android@^7
          npm install --save-dev @capacitor/cli@^7
          npx cap add android
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          marker = '    <application'
          permissions = (
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n\n'
          )
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace(marker, permissions + marker, 1)
          p.write_text(s)
          PY
          npx cap sync android

      - name: Build debug APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrumLab-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
